# Builds, tests and publishes a release when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Running it by hand (workflow_dispatch) is a dry run: it tests and builds the same
# archives and keeps them as workflow artifacts, but publishes nothing.
#
# Security model:
#   - the default token has no permissions; each job asks for the minimum it needs,
#     and only the last job can write (and it runs no code from the repository);
#   - actions are pinned to full commit hashes, and only GitHub's own actions are used;
#   - no secrets are required; the checkout does not leave credentials on disk;
#   - values that come from the event (the tag name) reach scripts through the
#     environment, never by being pasted into the script text;
#   - a tag is released only if it points at a commit on main and matches the version
#     in Cargo.toml, with dependencies exactly as in Cargo.lock (--locked);
#   - every archive gets a SHA-256 checksum and a signed build provenance attestation
#     (verify with: gh attestation verify <file> --repo <owner>/accela).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BUILD_DEPS: >-
    pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
    libxcb1-dev libfontconfig1-dev libfreetype-dev libvulkan-dev

jobs:
  verify:
    name: verify and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches the crate version and is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the version in Cargo.toml (v$version)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $TAG does not point at a commit on main"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $BUILD_DEPS

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format, lints and tests
        run: scripts/check.sh

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary runs on older glibc.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $BUILD_DEPS

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "false"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --locked --release -p accela

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          name="accela-v$version-$TARGET"
          mkdir -p "dist/$name"
          install -m755 target/release/accela "dist/$name/accela"
          "dist/$name/accela" --version
          cp README.md LICENSE "dist/$name/"
          cp third_party/gpui/LICENSE-APACHE "dist/$name/LICENSE-APACHE.gpui"
          tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accela-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "accela $TAG" dist/*.tar.gz dist/SHA256SUMS
